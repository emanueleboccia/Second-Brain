<!DOCTYPE html>
<!--
  Template del report social. Scritto il 16/09/2026 per la prova di agosto di Da Mamma Rosaria,
  allargato il 30/09/2026 per il report di agosto e settembre insieme e per la Tenuta Don Gaetano.

  Come si monta:
  1. in una cartella di lavoro si copiano questo file come index.html, la cartella assets/ (font e logo
     dal Brand kit del brand; per Mamma Rosaria anche lo sfondo a foglie bianco ridotto a 1240 px come
     foglie-bianco.jpg) e la cartella img/ con le copertine dei tre contenuti migliori;
  2. accanto si scrive dati.js, che definisce window.DATI: lo scrive prepara_bimestre.py (o, per un mese
     solo, prepara_dati.py), e i campi che il template legge sono tutti qui sotto nello script;
  3. si stampa con Chrome headless:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu
       --no-pdf-header-footer --virtual-time-budget=5000 --print-to-pdf=report.pdf file://…/index.html
  Per guardare le pagine prima della stampa: stessa riga con --screenshot e --window-size=794,<1123 × pagine>,
  aggiungendo ?schermo al file, che mette le pagine una sotto l'altra senza margini.

  Due vesti, scelte da DATI.tema:
  - «dmr» (o nessun tema): D-DIN e Regular Brush, arancio, marrone e crema, sfondo a foglie in copertina.
    Il Brush vale una parola sola per pagina, senza cifre né punteggiatura.
  - «tdg»: Cinzel maiuscolo spaziato per titoli, numeri e diciture, Georgia per il testo lungo, come dice
    il Leggimi dei font della Tenuta; marrone scuro, oro, crema e oro muto. La parola della testata è in
    Cinzel oro muto, perché la Tenuta non ha un secondo carattere.
  D-DIN non ha il segno meno (U+2212): nei numeri negativi si scrive il trattino breve «–», altrimenti
  Chrome stampa quel carattere in Helvetica e nel PDF compare un font che non è del brand.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Report social</title>
<style>
  @font-face { font-family: 'DDIN'; src: url('assets/D-DIN.otf'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'DDIN'; src: url('assets/D-DIN-Bold.otf'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'DDIN'; src: url('assets/D-DIN-Italic.otf'); font-weight: 400; font-style: italic; }
  @font-face { font-family: 'Brush'; src: url('assets/Regular Brush.otf'); }
  @font-face { font-family: 'Cinzel'; src: url('assets/Cinzel-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Cinzel'; src: url('assets/Cinzel-SemiBold.ttf'); font-weight: 600; }

  :root {
    --arancio: #F09D28;
    --marrone: #774F03;
    --crema: #FBF1DD;
    --bianco: #FFFFFF;
    --filo: rgba(119, 79, 3, 0.18);
    --tenue: rgba(119, 79, 3, 0.62);
    --testo: 'DDIN', sans-serif;
    --titoli: 'DDIN', sans-serif;
    --firma: 'Brush';
  }
  body.tdg {
    --arancio: #96825A;            /* l'accento: oro muto sul chiaro */
    --marrone: #1A1613;
    --crema: #EFE4C6;
    --bianco: #F4ECD6;
    --filo: rgba(26, 22, 19, 0.16);
    --tenue: rgba(26, 22, 19, 0.6);
    --testo: Georgia, serif;
    --titoli: 'Cinzel', serif;
    --firma: 'Cinzel';
    --oro: #D8BD87;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bianco); }
  body { font-family: var(--testo); color: var(--marrone); font-size: 10.5pt; line-height: 1.38;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  p, .dettaglio, .riquadro, .frasi, .fonte { text-wrap: pretty; }
  body.tdg { font-size: 9.8pt; line-height: 1.42; }

  .pagina { width: 210mm; height: 297mm; position: relative; overflow: hidden; padding: 17mm 16mm 20mm;
            page-break-after: always; break-after: page; background: var(--bianco); }
  .pagina:last-child { page-break-after: auto; break-after: auto; }
  .piede { position: absolute; left: 16mm; right: 16mm; bottom: 9mm; display: flex; justify-content: space-between;
           font-size: 8pt; color: var(--tenue); border-top: 0.4pt solid var(--filo); padding-top: 2.5mm; }
  body.tdg .piede { font-family: 'Cinzel', serif; letter-spacing: 0.08em; font-size: 7pt; }

  /* titolo di pagina: occhiello in corsivo, una sola parola nel carattere di firma */
  .testata { margin-bottom: 7mm; }
  .testata .occhiello { font-style: italic; font-size: 13pt; display: block; margin-bottom: -2mm; }
  .testata .brush { font-family: var(--firma); color: var(--arancio); font-size: 46pt; line-height: 1; display: inline-block; padding-bottom: 3.5mm; }
  .testata .sotto { font-size: 10pt; color: var(--tenue); margin-top: 0; }
  body.tdg .testata .occhiello { font-family: 'Cinzel', serif; font-style: normal; font-size: 9.5pt; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 2mm; }
  body.tdg .testata .brush { font-weight: 600; font-size: 30pt; letter-spacing: 0.12em; text-transform: uppercase; padding-bottom: 2mm;
                             border-bottom: 0.6pt solid var(--arancio); margin-bottom: 3mm; }

  h3 { font-family: var(--titoli); font-weight: 700; font-size: 11pt; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 3mm; }
  body.tdg h3 { font-weight: 600; font-size: 9.5pt; letter-spacing: 0.16em; }
  p { margin: 0 0 2.5mm; }
  .fonte { font-style: italic; font-size: 8pt; color: var(--tenue); margin-top: 2mm; }
  .var { font-size: 8.5pt; color: var(--tenue); }
  .var b { color: var(--marrone); }

  /* copertina */
  .copertina { padding: 0; background: url('assets/foglie-bianco.jpg') center / cover no-repeat; }
  .copertina .dentro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26mm 20mm 22mm; }
  .copertina .logo { width: 105mm; height: 70mm; object-fit: contain; }
  .copertina .centro { margin-top: 26mm; }
  .copertina .occhiello { font-style: italic; font-size: 17pt; }
  .copertina .mese { font-family: var(--firma); color: var(--arancio); font-size: 104pt; line-height: 1.05; margin: 2mm 0 0; }
  .copertina .anno { font-family: var(--titoli); font-weight: 700; font-size: 30pt; letter-spacing: 0.08em; margin-top: -2mm; }
  .copertina .periodo { font-size: 13pt; margin-top: 8mm; }
  .copertina .lettura { position: absolute; bottom: 24mm; left: 30mm; right: 30mm; font-size: 9.5pt; color: var(--tenue); }
  .copertina .canali { font-family: var(--titoli); font-weight: 700; font-size: 9pt; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 2mm; color: var(--marrone); }
  body.tdg .copertina { background: #1A1613; color: #F4ECD6; }
  body.tdg .copertina .logo { width: 95mm; height: 95mm; }
  body.tdg .copertina .centro { margin-top: 14mm; }
  body.tdg .copertina .occhiello { font-family: 'Cinzel', serif; font-style: normal; font-size: 11pt; letter-spacing: 0.3em; text-transform: uppercase; color: #D8BD87; }
  body.tdg .copertina .mese { font-weight: 600; font-size: 44pt; letter-spacing: 0.14em; text-transform: uppercase; color: #F4ECD6; margin-top: 6mm; }
  body.tdg .copertina .anno { font-family: 'Cinzel', serif; font-weight: 400; font-size: 20pt; letter-spacing: 0.4em; color: #D8BD87; margin-top: 3mm; }
  body.tdg .copertina .periodo { font-family: Georgia, serif; font-style: italic; color: #F4ECD6; }
  body.tdg .copertina .lettura { color: rgba(244, 236, 214, 0.72); }
  body.tdg .copertina .canali { font-family: 'Cinzel', serif; font-weight: 600; color: #D8BD87; letter-spacing: 0.24em; }
  body.tdg .copertina .filetto { width: 30mm; height: 0; border-top: 0.6pt solid #96825A; margin: 7mm auto 0; }

  /* cinque numeri */
  .cinque { display: grid; grid-template-columns: 1fr 1fr; gap: 11mm 8mm; margin-top: 4mm; }
  .cinque .scheda:first-child { grid-column: 1 / -1; }
  .scheda { border-top: 1.4mm solid var(--arancio); padding-top: 4mm; }
  .scheda .numero { font-family: var(--titoli); font-weight: 700; font-size: 46pt; line-height: 1; }
  .cinque .scheda:first-child .numero { font-size: 70pt; }
  .scheda .etichetta { font-family: var(--titoli); font-weight: 700; font-size: 12.5pt; margin-top: 3mm; }
  .scheda .dettaglio { font-size: 10.5pt; margin-top: 1.5mm; }
  body.tdg .scheda { border-top-width: 0.8mm; }
  body.tdg .scheda .numero { font-weight: 600; font-size: 36pt; }
  body.tdg .cinque .scheda:first-child .numero { font-size: 52pt; }
  body.tdg .scheda .etichetta { font-weight: 600; font-size: 9.5pt; letter-spacing: 0.1em; text-transform: uppercase; }
  body.tdg .scheda .dettaglio { font-size: 9.8pt; }

  /* contatti */
  .tre { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; margin-bottom: 4mm; }
  .grande { font-family: var(--titoli); font-weight: 700; font-size: 34pt; line-height: 1; }
  body.tdg .grande { font-weight: 600; font-size: 28pt; }
  .blocco { border-top: 0.6pt solid var(--filo); padding-top: 5mm; margin-top: 6mm; }
  .nd { font-family: var(--titoli); font-weight: 700; font-size: 15pt; color: var(--arancio); }
  .riquadro { background: var(--crema); padding: 4mm 5mm; margin-top: 6mm; font-size: 9.5pt; }

  /* canali */
  .metriche { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm 6mm; }
  .metrica .valore { font-family: var(--titoli); font-weight: 700; font-size: 24pt; line-height: 1.05; }
  body.tdg .metrica .valore { font-weight: 600; font-size: 20pt; }
  .metrica .nome { font-size: 9.5pt; }
  .grafico { margin-top: 7mm; }
  .grafico svg { width: 100%; height: 30mm; display: block; }
  .grafico .titolo { font-size: 9pt; margin-bottom: 2mm; }
  .grafico .giorni { display: flex; justify-content: space-between; font-size: 8pt; color: var(--tenue); margin-top: 1mm; }
  .grafico .giorni.posizionati { position: relative; height: 4mm; display: block; }
  .grafico .giorni.posizionati span { position: absolute; top: 0; white-space: nowrap; }
  .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; }
  .barre .riga { display: grid; grid-template-columns: 17mm 1fr 12mm; align-items: center; gap: 2mm; font-size: 9pt; margin-bottom: 1.4mm; }
  .barre .riga .b { height: 3mm; background: var(--arancio); }
  .barre .riga .n { text-align: right; }
  .elenco { font-size: 9.5pt; }
  .elenco div { display: flex; justify-content: space-between; border-bottom: 0.4pt solid var(--filo); padding: 1mm 0; }
  .follower { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; }
  .follower .valore { font-family: var(--titoli); font-weight: 700; font-size: 20pt; }
  body.tdg .follower .valore { font-weight: 600; font-size: 17pt; }

  /* tabelle */
  table { width: 100%; border-collapse: collapse; font-size: 8.8pt; }
  th { text-align: left; font-family: var(--titoli); font-weight: 700; font-size: 7.8pt; letter-spacing: 0.04em; text-transform: uppercase; padding: 1.4mm 1.2mm; border-bottom: 0.8pt solid var(--marrone); vertical-align: bottom; }
  body.tdg th { font-weight: 600; font-size: 6.8pt; letter-spacing: 0.08em; }
  td { padding: 1.3mm 1.2mm; border-bottom: 0.4pt solid var(--filo); vertical-align: top; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  td.muto { color: var(--tenue); font-style: italic; }
  th.gruppo { text-align: center; border-bottom: 0.4pt solid var(--filo); }
  tr.mese td { font-family: var(--titoli); font-weight: 700; font-size: 8pt; letter-spacing: 0.08em; text-transform: uppercase; color: var(--arancio); padding-top: 3mm; border-bottom: 0.6pt solid var(--arancio); }
  body.tdg tr.mese td { font-weight: 600; letter-spacing: 0.16em; }
  table.fitta { font-size: 8.2pt; }
  table.fitta td { padding: 1mm 1.2mm; }
  table.collab td { white-space: nowrap; padding-top: 0.8mm; padding-bottom: 0.8mm; }
  table.collab { font-size: 7.9pt; }

  /* migliori */
  .migliori { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
  .migliore .foto { width: 100%; height: 62mm; object-fit: cover; display: block; }
  .migliore .pos { font-family: var(--titoli); font-weight: 700; font-size: 26pt; color: var(--arancio); line-height: 1; margin-top: 3mm; }
  .migliore .titolo { font-family: var(--titoli); font-weight: 700; font-size: 11pt; margin-top: 1mm; }
  body.tdg .migliore .titolo { font-weight: 600; font-size: 9pt; letter-spacing: 0.08em; text-transform: uppercase; }
  .migliore .quando { font-style: italic; font-size: 9pt; }
  .migliore .numeri { font-size: 9pt; margin-top: 2mm; }
  .frasi { margin-top: 8mm; font-size: 10.5pt; }
  body.tdg .frasi { font-size: 9.8pt; }
  .frasi p { margin-bottom: 3.5mm; }

  /* a schermo, per il controllo: pagine una sotto l'altra */
  body.schermo .pagina { page-break-after: auto; }
</style>
</head>
<body>
<script src="dati.js"></script>
<script>
(function () {
  const D = window.DATI;
  if (D.tema) document.body.classList.add(D.tema);
  if (location.search.indexOf('schermo') >= 0) document.body.classList.add('schermo');
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const piede = n => `<div class="piede"><span>${esc(D.brand)} · Report social · ${esc(D.piede || (D.mese + ' ' + D.anno))}</span><span>${n}</span></div>`;
  const testata = (occhiello, brush, sotto) =>
    `<div class="testata"><span class="occhiello">${esc(occhiello)}</span><span class="brush">${esc(brush)}</span>${sotto ? `<div class="sotto">${esc(sotto)}</div>` : ''}</div>`;
  const variazione = v => v ? `<div class="var">${esc(v)}</div>` : '';
  let n = 0, html = '';
  const pagina = (classe, corpo, conPiede = true) => { n++; html += `<section class="pagina ${classe}">${corpo}${conPiede ? piede(n) : ''}</section>`; };
  const T = D.testate || {};

  // 1. copertina
  pagina('copertina', `<div class="dentro">
      <img class="logo" src="${esc(D.logo || 'assets/logo-orizzontale_colori.png')}" alt="">
      <div class="centro">
        <div class="occhiello">${esc(D.copertina.occhiello)}</div>
        <div class="mese">${esc(D.copertina.parola || D.mese)}</div>
        <div class="anno">${D.anno}</div>
        ${D.tema === 'tdg' ? '<div class="filetto"></div>' : ''}
        <div class="periodo">${esc(D.copertina.periodo)}</div>
      </div>
      <div class="lettura"><div class="canali">${esc(D.copertina.canali)}</div>${esc(D.copertina.lettura)}</div>
    </div>`, false);

  // 2. i numeri del periodo
  pagina('', testata((T.cinque || 'il mese in cinque'), 'numeri', D.cinque.sotto) +
    `<div class="cinque">${D.cinque.schede.map(s => `<div class="scheda"><div class="numero">${esc(s.numero)}</div>
       <div class="etichetta">${esc(s.etichetta)}</div><div class="dettaglio">${esc(s.dettaglio)}</div></div>`).join('')}</div>
     <div class="fonte" style="margin-top:9mm">${esc(D.cinque.fonte)}</div>`);

  // 3. chi ci ha contattato
  const C = D.contatti;
  const tabellaMesi = t => `<table style="margin:1mm 0 4mm"><thead><tr><th></th>${t.colonne.map(c => `<th class="n">${esc(c)}</th>`).join('')}</tr></thead>
       <tbody>${t.righe.map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map(v => `<td class="n">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  pagina('', testata('chi ci ha', 'contattato', C.sotto) +
    `<h3>${esc(C.google.titolo)}</h3>
     <div class="tre">${C.google.voci.map(v => `<div><div class="grande">${esc(v.valore)}</div><div><b>${esc(v.nome)}</b></div>${variazione(v.var)}</div>`).join('')}</div>
     ${C.google.tabella ? tabellaMesi(C.google.tabella) : ''}
     <p>${esc(C.google.visti)}</p>
     <div class="fonte">${esc(C.google.fonte)}</div>
     <div class="blocco"><h3>${esc(C.messaggi.titolo)}</h3><div class="nd">${esc(C.messaggi.valore)}</div><p>${esc(C.messaggi.testo)}</p></div>
     <div class="blocco"><h3>${esc(C.link.titolo)}</h3>${C.link.voci.map(v => `<p><b>${esc(v.canale)}:</b> ${esc(v.valore)}. ${esc(v.nota)}</p>`).join('')}</div>
     <div class="riquadro">${esc(C.nota)}</div>`);

  // 4 e 5. i canali
  const barre = (G) => {
    const valori = G.valori, max = Math.max(...valori), w = 1000, h = 170, passo = w / valori.length, ba = passo * 0.72;
    const colore = getComputedStyle(document.body).getPropertyValue('--arancio').trim() || '#F09D28';
    const rects = valori.map((v, i) => { const bh = max ? Math.max(2, v / max * h) : 2;
      return `<rect x="${(i * passo + (passo - ba) / 2).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${ba.toFixed(1)}" height="${bh.toFixed(1)}" fill="${colore}"/>`; }).join('');
    const divisori = (G.divisori || []).map(i => `<line x1="${(i * passo).toFixed(1)}" x2="${(i * passo).toFixed(1)}" y1="0" y2="${h}" stroke="${colore}" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>`).join('');
    const etichette = G.etichette
      ? `<div class="giorni posizionati">${G.etichette.map(e => `<span style="left:${(e.i / valori.length * 100).toFixed(2)}%;${e.fine ? 'transform:translateX(-100%)' : ''}">${esc(e.testo)}</span>`).join('')}</div>`
      : `<div class="giorni"><span>1</span><span>${Math.ceil(valori.length / 2)}</span><span>${valori.length}</span></div>`;
    return `<div class="titolo">${esc(G.titolo)}</div><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${rects}${divisori}</svg>${etichette}`;
  };
  const canale = (K, brush) => pagina('', testata(K.occhiello, brush, K.sotto) +
    `<div class="metriche">${K.metriche.map(m => `<div class="metrica"><div class="valore">${esc(m.valore)}</div><div class="nome">${esc(m.nome)}</div>${variazione(m.var)}</div>`).join('')}</div>
     <div class="grafico">${barre(K.giornaliero)}</div>
     <div class="blocco"><h3>${esc(K.follower.titolo)}</h3><div class="follower">${K.follower.voci.map(v => `<div><div class="valore">${esc(v.valore)}</div><div class="nome">${esc(v.nome)}</div></div>`).join('')}</div></div>
     <div class="blocco"><h3>${esc(K.pubblico.titolo)}</h3><p>${esc(K.pubblico.genere)}</p>
       <div class="due"><div class="barre">${K.pubblico.eta.map(e => `<div class="riga"><span>${esc(e.fascia)}</span><span class="b" style="width:${(e.pct / Math.max(...K.pubblico.eta.map(x => x.pct)) * 100).toFixed(1)}%"></span><span class="n">${esc(e.testo)}</span></div>`).join('')}</div>
       <div class="elenco">${K.pubblico.citta.map(c => `<div><span>${esc(c.nome)}</span><span>${esc(c.pct)}</span></div>`).join('')}</div></div></div>
     <div class="fonte">${esc(K.fonte)}</div>`);
  canale(D.instagram, 'instagram');
  canale(D.facebook, 'facebook');

  // 6. cosa abbiamo pubblicato: i post nostri, con le righe dei mesi se ci sono, poi le storie
  const P = D.pubblicato;
  const cella = v => (v === null || v === undefined) ? '<td class="n muto">—</td>' : `<td class="n">${esc(v)}</td>`;
  const righePost = righe => righe.map(r => r.mese
      ? `<tr class="mese"><td colspan="9">${esc(r.mese)}</td></tr>`
      : `<tr><td>${esc(r.data)}</td><td><b>${esc(r.titolo)}</b></td><td>${esc(r.formato)}</td>
         ${r.ig ? r.ig.map(cella).join('') : `<td colspan="3" class="muto">${esc(r.ig_nota || '')}</td>`}${r.fb.map(cella).join('')}</tr>`).join('');
  pagina('', testata('cosa abbiamo', 'pubblicato', P.sotto) +
    `<h3>${esc(P.post.titolo)}</h3>
     <table class="${P.post.fitta ? 'fitta' : ''}"><thead><tr><th rowspan="2">Data</th><th rowspan="2">Contenuto</th><th rowspan="2">Formato</th><th colspan="3" class="gruppo">Instagram</th><th colspan="3" class="gruppo">Facebook</th></tr>
       <tr><th class="n">Visualizz.</th><th class="n">Account</th><th class="n">Interaz.</th><th class="n">Visualizz.</th><th class="n">Account</th><th class="n">Interaz.</th></tr></thead>
       <tbody>${righePost(P.post.righe)}</tbody></table>
     <div class="fonte">${esc(P.post.fonte)}</div>
     ${P.collaborazioni ? `<div class="blocco"><h3>${esc(P.collaborazioni.titolo)}</h3><p>${esc(P.collaborazioni.testo)}</p>
     <table><thead><tr><th>Data</th><th>Contenuto</th><th>Formato</th><th class="n">Visualizz.</th><th class="n">Account</th><th class="n">Interaz.</th></tr></thead>
       <tbody>${P.collaborazioni.righe.map(r => `<tr><td>${esc(r.data)}</td><td>${esc(r.titolo)}</td><td>${esc(r.formato)}</td><td class="n">${esc(r.ig[0])}</td><td class="n">${esc(r.ig[1])}</td><td class="n">${esc(r.ig[2])}</td></tr>`).join('')}</tbody></table></div>` : ''}
     ${P.storie && !P.storie_pagina ? `<div class="blocco"><h3>${esc(P.storie.titolo)}</h3>${P.storie.righe.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : ''}`);

  // 6 bis. su una pagina a parte, se ci sono: le collaborazioni lunghe e le storie
  if (D.collab_pagina) {
    const Q = D.collab_pagina;
    pagina('', testata(Q.occhiello, Q.parola, Q.sotto) +
      `<table class="fitta collab"><thead><tr><th>Data</th><th>Chi l'ha pubblicato</th><th>Contenuto</th><th>Formato</th><th class="n">Visualizz.</th><th class="n">Account</th><th class="n">Interaz.</th></tr></thead>
         <tbody>${Q.righe.map(r => r.mese ? `<tr class="mese"><td colspan="7">${esc(r.mese)}</td></tr>`
           : `<tr><td>${esc(r.data)}</td><td>${esc(r.chi)}</td><td>${esc(r.titolo)}</td><td>${esc(r.formato)}</td><td class="n">${esc(r.ig[0])}</td><td class="n">${esc(r.ig[1])}</td><td class="n">${esc(r.ig[2])}</td></tr>`).join('')}</tbody></table>
       <div class="fonte">${esc(Q.fonte)}</div>
       ${P.storie && P.storie_pagina ? `<div class="blocco"><h3>${esc(P.storie.titolo)}</h3>${P.storie.righe.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : ''}`);
  }

  // 7. cosa ha funzionato
  const M = D.migliori;
  pagina('', testata('cosa ha', 'funzionato', M.sotto) +
    `<div class="migliori">${M.schede.map((s, i) => `<div class="migliore"><img class="foto" src="${esc(s.img)}" alt="">
       <div class="pos">${i + 1}</div><div class="titolo">${esc(s.titolo)}</div><div class="quando">${esc(s.quando)}</div>
       <div class="numeri">${s.numeri.map(x => `<div>${esc(x)}</div>`).join('')}</div></div>`).join('')}</div>
     <div class="frasi">${M.frasi.map(f => `<p>${esc(f)}</p>`).join('')}</div>`);

  // 8. il confronto: la prima colonna è il nome, le altre i valori
  const K = D.confronto;
  pagina('', testata('i numeri a', 'confronto', K.sotto) +
    `${K.testo.map(t => `<p>${esc(t)}</p>`).join('')}
     <table style="margin-top:5mm"><thead><tr><th>Numero</th>${K.colonne.map((c, i) => `<th class="${K.testo_ultima && i === K.colonne.length - 1 ? '' : 'n'}">${esc(c)}</th>`).join('')}</tr></thead>
       <tbody>${K.righe.map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map((v, i) => {
         if (K.testo_ultima && i === r.length - 2) return `<td>${esc(v)}</td>`;
         return `<td class="n">${i === (K.grassetto || 0) ? `<b>${esc(v)}</b>` : esc(v)}</td>`; }).join('')}</tr>`).join('')}</tbody></table>
     <div class="blocco"><h3>Note sulle fonti</h3>${K.note.map(t => `<p class="elenco" style="display:block">${esc(t)}</p>`).join('')}</div>`);

  document.body.insertAdjacentHTML('beforeend', html);

  // Nessun paragrafo finisce con una o due parole sole sull'ultima riga, e date e orari non si spezzano:
  // regola del CLAUDE.md di radice, 22/09/2026. Le ultime tre parole si legano con spazi che non vanno a capo.
  const MESI = 'gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre';
  const lega = el => {
    const testi = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) testi.push(w.currentNode);
    testi.forEach(t => { t.nodeValue = t.nodeValue.replace(new RegExp(`(\\d+°?) (${MESI})`, 'g'), '$1 $2').replace(/(\d{1,2}:\d{2}) (e|alle) /g, '$1 $2 '); });
    const ultimo = testi.filter(t => t.nodeValue.trim()).pop();
    if (!ultimo) return;
    let v = ultimo.nodeValue.replace(/\s+$/, ''), legati = 0;
    for (let i = v.length - 1; i > 0 && legati < 2; i--) if (v[i] === ' ') { v = v.slice(0, i) + ' ' + v.slice(i + 1); legati++; }
    ultimo.nodeValue = v;
  };
  document.querySelectorAll('p, .dettaglio, .fonte, .riquadro, .testata .sotto, .var, .lettura').forEach(lega);
})();
</script>
</body>
</html>
